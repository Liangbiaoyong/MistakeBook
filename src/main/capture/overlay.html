<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>框选截图</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
      background: transparent;
    }

    #bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
      user-select: none;
      -webkit-app-region: no-drag;
    }

    #selection {
      position: absolute;
      border: 2px solid #00ff00;
      background: rgba(0, 255, 0, 0.15);
      display: none;
      pointer-events: none;
    }

    #size-label {
      position: absolute;
      top: -30px;
      left: 0;
      background: rgba(0, 255, 0, 0.9);
      color: #000;
      padding: 2px 8px;
      font-size: 13px;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      white-space: nowrap;
      border-radius: 3px;
    }

    #hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      font-family: system-ui, sans-serif;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <img id="bg" draggable="false" />
  <div id="selection">
    <div id="size-label"></div>
  </div>
  <div id="hint">拖动鼠标框选区域 | ESC 或 右键 取消 | 回车 确认</div>

  <script>
    // 启用 nodeIntegration 和 contextIsolation=false 是因为：
    // 1. 这个 overlay 窗口完全由主进程创建和控制，不加载任何外部资源
    // 2. 它是可信的本地窗口，不存在安全风险
    // 3. 这样可以避免额外的 preload 脚本和 IPC 通信开销
    const { ipcRenderer } = require('electron')

    const bg = document.getElementById('bg')
    const selection = document.getElementById('selection')
    const sizeLabel = document.getElementById('size-label')
    const hint = document.getElementById('hint')

    let isDragging = false
    let startX = 0
    let startY = 0
    let currentX = 0
    let currentY = 0
    let hasSelection = false

    // 从 URL 参数获取截图数据
    const urlParams = new URLSearchParams(window.location.search)
    const screenshotDataUrl = urlParams.get('screenshot')

    if (screenshotDataUrl) {
      bg.src = screenshotDataUrl
    }

    // 获取实际坐标（相对窗口）
    function getPos(e) {
      return {
        x: e.clientX,
        y: e.clientY
      }
    }

    // 更新选区显示
    function updateSelection() {
      const x = Math.min(startX, currentX)
      const y = Math.min(startY, currentY)
      const w = Math.abs(currentX - startX)
      const h = Math.abs(currentY - startY)

      selection.style.left = x + 'px'
      selection.style.top = y + 'px'
      selection.style.width = w + 'px'
      selection.style.height = h + 'px'

      // 显示像素尺寸（CSS 像素）
      sizeLabel.textContent = w + ' × ' + h + ' px'
      sizeLabel.style.left = '0px'

      hasSelection = w >= 8 && h >= 8
    }

    // 提交选区到主进程
    function commitSelection() {
      if (!hasSelection) {
        return
      }

      const x = Math.min(startX, currentX)
      const y = Math.min(startY, currentY)
      const w = Math.abs(currentX - startX)
      const h = Math.abs(currentY - startY)

      // HiDPI/Retina: 乘以 devicePixelRatio 得到实际像素坐标
      const dpr = window.devicePixelRatio || 1
      const rect = {
        x: Math.round(x * dpr),
        y: Math.round(y * dpr),
        width: Math.round(w * dpr),
        height: Math.round(h * dpr)
      }

      ipcRenderer.send('overlay:commit', rect)
    }

    // 取消选区
    function cancelSelection() {
      ipcRenderer.send('overlay:cancel')
    }

    // 事件监听
    bg.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        // 右键取消
        cancelSelection()
        return
      }

      const pos = getPos(e)
      startX = pos.x
      startY = pos.y
      currentX = pos.x
      currentY = pos.y
      isDragging = true
      selection.style.display = 'block'
      updateSelection()
    })

    bg.addEventListener('mousemove', (e) => {
      if (!isDragging) return

      const pos = getPos(e)
      currentX = pos.x
      currentY = pos.y
      updateSelection()
    })

    bg.addEventListener('mouseup', (e) => {
      if (e.button === 2 || !isDragging) return

      isDragging = false
      const pos = getPos(e)
      currentX = pos.x
      currentY = pos.y
      updateSelection()

      if (hasSelection) {
        // 选区足够大，显示确认提示
        hint.textContent = '按回车确认 | ESC 或 右键 取消'
      }
    })

    // 键盘事件
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        cancelSelection()
      } else if (e.key === 'Enter' && hasSelection) {
        commitSelection()
      }
    })

    // 禁用右键菜单
    bg.addEventListener('contextmenu', (e) => {
      e.preventDefault()
      cancelSelection()
    })
  </script>
</body>
</html>
